site_name: DETai — Knowledge Core
site_url: https://detai-org.github.io/Knowledge_substrate/
use_directory_urls: true
docs_dir: knowledge_core/source_of_truth/docs/ecosystem
theme:
  name: material
  custom_dir: knowledge_core/source_of_truth/assets/overrides
  features:
  - navigation.instant
  - navigation.indexes
  - navigation.path
  - search.suggest
  - search.highlight
plugins:
- callouts:
    aliases: false
    breakless_lists: true
- mkdocs-simple-hooks:
    hooks:
      on_page_markdown: knowledge_core.source_of_truth.assets.hooks.mkdocs_hooks:convert_obsidian_wikilinks
- redirects:
    redirect_maps:
      'ru/ecosystem/DETai/Platform_DETai/E1-Core/Francis Galton/index.md': 'ru/ecosystem/DETai/Platform_DETai/products/francis-galton/index.md'
      'ru/ecosystem/DETai/Platform_DETai/E1-Core/detai-matrix/index.md': 'ru/ecosystem/DETai/Platform_DETai/products/detai-matrix/index.md'
      'ru/ecosystem/DETai/Platform_DETai/E1-Core/detai-pulse/index.md': 'ru/ecosystem/DETai/Platform_DETai/products/detai-pulse/index.md'
      'ru/ecosystem/DETai/Platform_DETai/E1-Core/🌀Psykhḗ AI/index.md': 'ru/ecosystem/DETai/Platform_DETai/products/psykhe-ai/index.md'
      'ru/ecosystem/DETai/Platform_DETai/E2-Brand/news-agent/index.md': 'ru/ecosystem/DETai/Platform_DETai/dormant-projects/news-agent/index.md'
      'ru/ecosystem/DETai/Platform_DETai/E2-Brand/psychology-in-quotes/index.md': 'ru/ecosystem/DETai/Platform_DETai/products/psychology-in-quotes/index.md'
      'ru/ecosystem/DETai/Platform_DETai/E3-Infra/gpt_promt_engine/index.md': 'ru/ecosystem/DETai/Platform_DETai/dormant-projects/gpt-prompt-engine/index.md'
      'ru/ecosystem/Tools/🤖 GPT/index.md': 'ru/ecosystem/Tools/🧭Codex/index.md'
- search
markdown_extensions:
- admonition
- toc:
    permalink: true
    slugify: !!python/name:markdown.extensions.toc.slugify_unicode
    separator: "-"
- pymdownx.superfences
- pymdownx.details
extra_css:
- assets/stylesheets/extra.css
extra_javascript:
- assets/javascripts/chatgpt-prompt.js
- assets/javascripts/chatgpt-button.js
- assets/javascripts/nav-state.js
- assets/javascripts/language-switcher.js
exclude_docs: |
  ru/ecosystem/sortspec.md
  ru/ecosystem/README.md

